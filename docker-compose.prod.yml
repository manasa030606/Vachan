# Vachan — the whole app on ONE machine with Docker (a simple alternative to Vercel + Render + Neon).
#
#   cp .env.production.example .env.production     # then fill in real values (never commit it)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec backend npm run db:seed -w backend
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec backend npm run rag:index -w backend
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec backend npm run admin:grant -w backend -- you@example.com
#   open http://localhost:3000
#
# Migrations run automatically every time the backend container starts (prisma migrate deploy).
# Put a TLS reverse proxy (Caddy, nginx, a cloud load balancer) in front for a public domain.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vachan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: vachan
    volumes:
      - vachan-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vachan -d vachan"]
      interval: 5s
      retries: 10
    # No "ports:" — the database is reachable only from the other containers.

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vachan:${POSTGRES_PASSWORD}@postgres:5432/vachan?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: "1" # the frontend's /api proxy
      RAG_ENABLED: ${RAG_ENABLED:-true} # the embedding model needs ~1 GB RAM
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
    volumes:
      - vachan-model-cache:/app/backend/.cache # the embedding model is downloaded once
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      start_period: 30s
    # No "ports:" — the browser reaches the API through the frontend's /api proxy.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { BACKEND_URL: "http://backend:4000" }
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3000:3000"

volumes:
  vachan-prod-data:
  vachan-model-cache:
